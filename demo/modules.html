<!DOCTYPE html>
<!-- class="js" 是产品自己的约定（signalforge.css:441-442）：它剥掉激活标签的静态红底让 tpuck
     独占高亮，并把标签文字提到 puck 之上。漏掉它，激活标签的字会被 puck 盖住。 -->
<html lang="en" class="js" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignalForge modules</title>
<!--
  产品界面的真实复刻，不是仿制。
  · 样式表是产品自己的 sf/signalforge.css + sf/extensions.css，原样取自
    SignalForge-frontend@feature/OEM-488-onboarding-tour
  · DOM 结构照 SignalsView.tsx / detail.tsx / Contacts.tsx / shared.tsx 复刻
  真的是结构、样式、交互；假的只有数据。
  跑在 iframe 里 —— 产品 CSS 有 200KB 全局选择器，与官网 landing.css 大面积撞名。
  解说与步骤药丸不在这里，在父页面：产品归产品的设计系统，营销归营销的。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sf/signalforge.css">
<link rel="stylesheet" href="sf/extensions.css">
<style>
  /* 不覆盖 body 背景 —— signalforge.css:242 已经给了 var(--surface-page)，
     覆盖掉会让面板和页面变成同一个色，整屏发平。 */
  html,body{margin:0;height:100%;overflow:hidden}
  .mod{position:absolute;inset:0;padding:22px 24px;opacity:0;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
    transform:translateY(10px);transition:opacity .5s var(--spring),transform .5s var(--spring)}
  /* .main 提供模块之间 16px 的竖向节奏，与产品一致。
     .main 是 flex column，默认会把最后一个面板拉满剩余高度 —— 演示里那是一大片空白，
     所以让每个子块按内容高度收敛。 */
  .mod > .main > *{flex:0 0 auto}
  /* 产品里 .stage 把主栏限在 1560px 且详情页是双栏，评分条不会拉成一整屏那么长。
     演示是单模块全宽，所以自己收一个上限，否则 24/25 那根条会横跨 1500px。 */
  .mod > .main{width:100%;max-width:1080px}
  /* 两极开关真实的宿主是 .tbar —— .tabs.seg 的样式带 .tbar 祖先限定。
     这里只保留承载开关所需的最小 tbar，不放 workspace 芯片和头像。 */
  .tbar.bare{padding:7px 9px;align-self:flex-start}
  .mod.on{opacity:1;pointer-events:auto;transform:none}
  /* 模拟光标：演示里"产品被用给你看"的那只手 */
  .simcur{position:absolute;z-index:60;width:16px;height:23px;left:0;top:0;opacity:0;
    transition:opacity .3s, transform .85s cubic-bezier(.32,.72,0,1);
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.28));pointer-events:none}
  .simcur.on{opacity:1}
  .simcur.press{transform-origin:2px 2px}
  .simcur .rip{position:absolute;left:-9px;top:-9px;width:34px;height:34px;border-radius:50%;
    border:2px solid var(--accent);opacity:0}
  .simcur.tap .rip{animation:tap .5s var(--spring)}
  @keyframes tap{0%{opacity:.9;transform:scale(.25)}100%{opacity:0;transform:scale(1)}}
  /* 轻量聚焦：不压暗整页，只把当前讨论的区域抬起来 */
  .lift{position:relative;z-index:2;border-radius:var(--r-md);
    box-shadow:0 0 0 2px rgba(var(--red-rgb),.55),0 0 0 7px rgba(var(--red-rgb),.16);
    transition:box-shadow .45s var(--spring)}
  @media (prefers-reduced-motion:reduce){
    .mod,.simcur{transition:none}
    .simcur{display:none}
  }
</style>
</head>
<body>

<!-- ═══ 幕 1 · RANK ── 排序列表模块（照 SignalsView.tsx / TendersView.tsx） ═══ -->
<section class="mod" id="m-rank">
  <div class="main">
    <header class="tbar panel bare">
      <nav class="tabs seg" id="poles" aria-label="Pole">
        <span class="tpuck" id="tpuck" aria-hidden="true"></span>
        <a href="#" id="poleT">Gov tenders</a>
        <a href="#" id="poleS" class="on" aria-current="page">Buying signals</a>
      </nav>
    </header>
    <div class="panel tbl">
      <div class="scroll">
        <table>
          <colgroup id="cg"></colgroup>
          <thead id="thd"></thead>
          <tbody id="tbd"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<!-- ═══ 幕 2 · EXPLAIN ── 评分归因模块（照 detail.tsx 的 DetailHeader + WBar） ═══ -->
<section class="mod" id="m-explain">
  <div class="main">
  <div class="dhead panel" style="margin-bottom:12px">
    <div class="co-mark">MI</div>
    <div class="who">
      <h1>Magna International</h1>
      <div class="sub">Breaks ground on new stamping facility <span class="tag">Signal</span> <span class="tag">News</span> Detected Jul 19, 2026</div>
    </div>
    <div class="sp"></div>
    <div class="scorebig"><span class="n">91</span><span class="cap">signal<br>score</span></div>
  </div>
  <div class="dpanel panel" id="wbarPanel">
    <div class="kick">Match analysis</div>
    <h3>Why this scored 91</h3>
    <div class="wbar" id="wbar"></div>
  </div>
  </div>
</section>

<!-- ═══ 幕 3 · REACH ── 联系人解锁模块（照 Contacts.tsx 的表 + 计费三段） ═══ -->
<section class="mod" id="m-reach">
  <div class="main">
  <div class="panel dpanel ctpanel">
    <div class="ctwrap">
      <table class="cttable">
        <thead>
          <tr>
            <th class="c-ctname">Name</th>
            <th class="c-cttitle">Why them</th>
            <th class="fcol">Email</th>
            <th class="fcol">Phone</th>
          </tr>
        </thead>
        <tbody id="ctb"></tbody>
      </table>
      <div class="ctfoot" id="ctfoot">Finding people is free. Only revealing a detail spends, one click at a time.</div>
    </div>
  </div>
  </div>
</section>

<div class="simcur" id="cur" aria-hidden="true">
  <span class="rip"></span>
  <svg viewBox="0 0 16 23" width="16" height="23"><path d="M1.2 1.2l12.6 9.3-5.7.9 3.2 6.5-2.7 1.3-3.2-6.5-3.5 4z" fill="#fff" stroke="#21201c" stroke-width="1.5" stroke-linejoin="round"/></svg>
</div>

<script>
/* ── 数据：假的。字段与产品 SignalListItem / TenderListItem 对齐 ─────────────── */
const SIGNALS = [
  {s:92, co:"Hydro-Québec",        loc:"Montréal, QC",   h:"$2.1B grid modernization program announced",    t:"Modernization",      fb:"undecided",    src:"News",      d:"JUL 21"},
  {s:91, co:"Magna International", loc:"London, ON",     h:"Breaks ground on new stamping facility",        t:"Facility expansion", fb:"relevant",     src:"News",      d:"JUL 19"},
  {s:85, co:"Linamar",             loc:"Guelph, ON",     h:"Expands Guelph machining capacity",             t:"Capacity expansion", fb:"undecided",    src:"News",      d:"JUL 17"},
  {s:81, co:"Suncor Energy",       loc:"Calgary, AB",    h:"10-K filing notes compressor station upgrades", t:"Filing",             fb:"undecided",    src:"SEC EDGAR", d:"JUL 12"},
  {s:68, co:"Cenovus Energy",      loc:"Calgary, AB",    h:"Hiring plant reliability engineers, 14 roles",  t:"Hiring growth",      fb:"not_relevant", src:"Careers",   d:"JUL 05"},
];
const TENDERS = [
  {s:88, co:"HVAC Replacement — Federal Building Complex", loc:"EW527-241338 · Canada", h:"Public Works & Government Services Canada", t:"$1.2M CAD", fb:"undecided",    src:"MERX",     d:"JUL 27"},
  {s:84, co:"Rotating Equipment Maintenance",              loc:"W912-26-R-0041 · USA",  h:"US Army Corps of Engineers",                t:"$2.7M USD", fb:"undecided",    src:"SAM.gov",  d:"AUG 12"},
  {s:79, co:"Industrial Air Compressors, standing offer",  loc:"TX-SO-4471 · USA",      h:"Texas SmartBuy",                            t:"$480K USD", fb:"undecided",    src:"SmartBuy", d:"AUG 02"},
  {s:61, co:"HVAC and air treatment, school district",     loc:"ON-2026-118 · Canada",  h:"Ontario Tenders Portal",                    t:"$610K CAD", fb:"not_relevant", src:"Ontario",  d:"JUL 24"},
];
/* 逐字取自已批准的 mockup signal-contacts-inline.html 的 Magna 场景。
   就这三行 —— 那份 mockup 只有这三个维度，不补第四第五行。 */
const WROWS = [
  {lb:"Market relevance", pct:96, v:"24/25", why:"New stamping lines need press automation and die-handling equipment — direct fit with your product line."},
  {lb:"Timing",           pct:92, v:"23/25", why:"Groundbreaking phase — equipment sourcing decisions are being made in the next two quarters."},
  {lb:"Buyer access",     pct:90, v:"18/20", why:"Ontario site with named plant leadership — decision-makers are identifiable and reachable."},
];
/* 职位与「为什么是这个人」逐字取自 mockup signal-contacts-inline.html。
   mockup 里是具名真人（Sarah Chen / s.chen@magna.com 之类），Magna 是真实公司 ——
   把这种东西放上公开官网等于伪造一家真实企业的人员记录。按 brochure Plate 10 的先例：
   只留职位，不出现任何具名个人，值全部打码。 */
const PEOPLE = [
  {ini:"VP", role:"VP Operations",                    co:"Magna Body & Chassis",  why:"Owns capex approval for new-plant equipment programs — the budget for exactly what this signal is about.", best:true},
  {ini:"PM", role:"Plant Manager",                    co:"London Stamping",       why:"Named site lead in the groundbreaking announcement.",                                                       best:false},
  {ini:"DM", role:"Director, Manufacturing Engineering", co:"Magna International", why:"Specs press-line automation for body-in-white programs.",                                                  best:false},
];

const COLS = {
  signals:["c-match","c-sigco","c-sighead","c-sigtype","c-sigr2","c-sigsrc","c-sigpub"],
  tenders:["c-match","c-tender","c-agency","c-value","c-decision","c-closes","c-prog"],
};
const HEAD = {
  signals:[["Score",1],["Company",0],["Signal",0],["Type",0],["Feedback",0],["Source",0],["Published",1]],
  tenders:[["Match",1],["Tender",0],["Agency",0],["Value",0],["Decision",0],["Source",0],["Closes",1]],
};

const initials = n => { const p=n.split(" — ")[0].trim().split(/\s+/).filter(w=>/[\p{L}\p{N}]/u.test(w));
  return p.length===1 ? p[0].slice(0,2).toUpperCase() : p.slice(0,2).map(w=>w[0].toUpperCase()).join(""); };
const tier = n => n>=80?"s1":n>=60?"s2":"s3";
const fbTag = f => f==="relevant" ? '<span class="tag good">Relevant</span>'
              : f==="not_relevant" ? '<span class="tag">Not relevant</span>'
              : '<span class="tag status">Undecided</span>';

let pole = "signals";
function renderList(){
  const rows = pole==="signals" ? SIGNALS : TENDERS;
  cg.innerHTML = COLS[pole].map(c=>`<col class="${c}">`).join("");
  thd.innerHTML = "<tr>" + HEAD[pole].map(([l,r])=>`<th${r?' class="r"':''}>${l}</th>`).join("") + "</tr>";
  tbd.innerHTML = rows.map(r=>{
    const k = Math.max(0, Math.min(1,(r.s-50)/50));
    return `<tr class="lrow" style="--dep:${(0.02+k*0.32).toFixed(3)};--ext:${Math.round(16+k*64)}%">
      <td><span class="mscore ${tier(r.s)}">${r.s}</span></td>
      <td><div class="cowrap"><div class="co-mark">${initials(r.co)}</div><div class="cnwrap">
        <div class="cn"><span>${r.co}</span></div><div class="loc">${r.loc}</div></div></div></td>
      <td><div class="sg"><span>${r.h}</span></div></td>
      <td><span class="tag"><span class="tgsc"><span>${r.t}</span></span></span></td>
      <td>${fbTag(r.fb)}</td>
      <td><span class="dt">${r.src}</span></td>
      <td class="r"><span class="dt">${r.d}</span></td>
    </tr>`;
  }).join("");
}
function movePuck(){
  const on = document.querySelector("#poles a.on");
  if(!on || !on.offsetWidth) return;
  tpuck.style.width = on.offsetWidth+"px";
  tpuck.style.transform = `translateX(${on.offsetLeft}px)`;
}
function setPole(p){
  if(p===pole) return;
  pole = p;
  poleS.classList.toggle("on", p==="signals");
  poleT.classList.toggle("on", p==="tenders");
  movePuck(); renderList();
}
poleT.onclick = e => { e.preventDefault(); setPole("tenders"); };
poleS.onclick = e => { e.preventDefault(); setPole("signals"); };

/* 评分条：默认收起理由，点一行展开 —— 「点开任意一行看那几分从哪来」 */
function renderWbar(){
  wbar.innerHTML = WROWS.map((r,i)=>`
    <div class="wrow" data-i="${i}" role="button" tabindex="0" style="cursor:pointer">
      <span class="lb">${r.lb}</span>
      <div class="mid"><div class="tr"><i style="width:${r.pct}%"></i></div>
        <div class="why" hidden>${r.why}</div></div>
      <span class="v">${r.v}</span>
    </div>`).join("");
  wbar.querySelectorAll(".wrow").forEach(el=>{
    const t = () => { const w = el.querySelector(".why"); w.hidden = !w.hidden; el.classList.toggle("lift", !w.hidden); };
    el.addEventListener("click", t);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); t(); } });
  });
}

/* 联系人：找到=免费 → 点一次解锁邮箱 → 再点解锁电话。值全部打码。 */
const LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
let reach = 0;
function renderReach(){
  ctb.innerHTML = PEOPLE.map(p=>`
    <tr${p.best?' class="bestrow"':''}>
      <td><div class="ctwho"><div class="co-mark">${p.ini}</div><div class="ctid">
        <div class="ctnm"><div class="cn"><span>${p.role}</span></div>${p.best?'<span class="bm">Best match</span>':''}</div>
        <div class="loc"><span>${p.co}</span></div></div></div></td>
      <td><div class="loc"><span>${p.why}</span></div></td>
      <td>${reach>=1 ? '<span class="vchip"><span class="vv">d•••••@•••••••.com</span></span>'
                     : `<span class="tag status">${LOCK} Locked</span>`}</td>
      <td>${reach>=2 ? '<span class="vchip"><span class="vv">+1 ••• ••• ••••</span></span>'
                     : `<span class="tag status">${LOCK} Locked</span>`}</td>
    </tr>`).join("");
  ctfoot.textContent = reach===0 ? "Finding people is free. Only revealing a detail spends, one click at a time."
    : reach===1 ? "Email unlocked and stored. Phone never unlocks before email — the product enforces that order."
    : "Never charged twice. Repeated clicks return the saved value instead of spending again.";
}

/* ── 模拟光标 ───────────────────────────────────────────────────────────── */
function moveCur(el, dx=0, dy=0){
  if(!el) return Promise.resolve();
  const r = el.getBoundingClientRect();
  cur.classList.add("on");
  cur.style.transform = `translate(${Math.round(r.left + r.width/2 + dx)}px, ${Math.round(r.top + r.height/2 + dy)}px)`;
  return new Promise(res=>setTimeout(res, 900));
}
function tap(){
  cur.classList.remove("tap"); void cur.offsetWidth; cur.classList.add("tap");
  return new Promise(res=>setTimeout(res, 320));
}
const hideCur = () => cur.classList.remove("on");
const wait = ms => new Promise(r=>setTimeout(r, ms));

/* ── 幕：每一幕自己演一遍，可被打断 ───────────────────────────────────────── */
let token = 0;
const alive = t => t === token;

async function playRank(t){
  setPole("signals");
  await wait(700); if(!alive(t))return;
  await moveCur(poleT); if(!alive(t))return;
  await tap(); if(!alive(t))return;
  setPole("tenders");
  await wait(1600); if(!alive(t))return;
  await moveCur(poleS); if(!alive(t))return;
  await tap(); if(!alive(t))return;
  setPole("signals");
  await wait(900); if(!alive(t))return;
  hideCur();
}
async function playExplain(t){
  renderWbar();
  await wait(800); if(!alive(t))return;
  const rows = [...wbar.querySelectorAll(".wrow")];
  for(const i of [0,2]){
    await moveCur(rows[i], -60); if(!alive(t))return;
    await tap(); if(!alive(t))return;
    rows[i].click();
    await wait(1700); if(!alive(t))return;
  }
  hideCur();
}
async function playReach(t){
  reach = 0; renderReach();
  await wait(800); if(!alive(t))return;
  for(const step of [1,2]){
    const cell = ctb.querySelector(`tr td:nth-child(${step+2}) .tag`);
    await moveCur(cell); if(!alive(t))return;
    await tap(); if(!alive(t))return;
    reach = step; renderReach();
    await wait(1700); if(!alive(t))return;
  }
  hideCur();
}

const SCENES = {
  rank:    { el:"m-rank",    play:playRank },
  explain: { el:"m-explain", play:playExplain },
  reach:   { el:"m-reach",   play:playReach },
};
let current = null;

function show(id){
  if(id === current) return;
  current = id;
  token++;
  const t = token;
  hideCur();
  Object.values(SCENES).forEach(s=>document.getElementById(s.el).classList.remove("on"));
  const sc = SCENES[id]; if(!sc) return;
  document.getElementById(sc.el).classList.add("on");
  if(id === "rank") requestAnimationFrame(movePuck);
  reportHeight();
  sc.play(t);
}

/* 每一幕高度不同 —— 把内容高度报给父页面，让外框跟着收放，框内不留死空白。
   字体落地后再报一次：webfont 会改行高，先报的数会偏小。 */
function reportHeight(){
  const main = document.querySelector(".mod.on > .main");
  if(!main || parent === window) return;
  const pad = 22 * 2;
  parent.postMessage({ sfHeight: Math.ceil(main.getBoundingClientRect().height + pad) }, "*");
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>setTimeout(reportHeight, 60));
addEventListener("resize", reportHeight);

renderList(); renderWbar(); renderReach();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(movePuck);
addEventListener("resize", movePuck);

addEventListener("message", e=>{
  const d = e.data || {};
  if(d.sfScene) show(d.sfScene);
});
show("rank");
parent !== window && parent.postMessage({sfReady:true}, "*");
</script>
</body>
</html>
